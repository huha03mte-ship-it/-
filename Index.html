<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS Game | Premium Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Prompt', sans-serif; background: #0f172a; color: #f8fafc; min-height: 100vh; overflow-x: hidden; }
        
        /* Glassmorphism Effect */
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); border-radius: 20px; }
        
        /* Inputs & Buttons */
        .input-dark { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(52, 211, 153, 0.3); color: white; transition: all 0.3s; }
        .input-dark:focus { border-color: #34d399; box-shadow: 0 0 10px rgba(52, 211, 153, 0.2); outline: none; }
        .btn-neon { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; transition: all 0.3s; position: relative; overflow: hidden; }
        .btn-neon:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4); }
        .btn-neon:active { transform: translateY(1px); }
        
        /* Bottom Nav */
        .nav-btn { color: #64748b; transition: all 0.3s; }
        .nav-btn.active { color: #34d399; text-shadow: 0 0 10px rgba(52, 211, 153, 0.5); transform: translateY(-3px); }
        
        /* Animations */
        .section { display: none; opacity: 0; transition: opacity 0.4s ease, transform 0.4s ease; transform: translateY(20px); }
        .section.active { display: block; opacity: 1; transform: translateY(0); }
        
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .floating { animation: float 3s ease-in-out infinite; }
        
        @keyframes fightShake { 0% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-20px) rotate(-15deg) scale(1.1); } 50% { transform: translateY(0) rotate(0) scale(1); } 75% { transform: translateY(-20px) rotate(15deg) scale(1.1); } 100% { transform: translateY(0) rotate(0) scale(1); } }
        .anim-fight { animation: fightShake 0.4s infinite; font-size: 6rem; text-shadow: 0 10px 20px rgba(0,0,0,0.5); display: inline-block; }
        
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 70% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 1; } }
        .result-pop { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; font-size: 6rem; display: inline-block; }
        .glow-win { text-shadow: 0 0 30px #10b981; } .glow-lose { text-shadow: 0 0 30px #ef4444; }

        .game-btn { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .game-btn:hover { background: rgba(52,211,153,0.2); border-color: #34d399; transform: scale(1.1); }
    </style>
</head>
<body class="pb-24 pt-4 md:pt-10">

    <div id="auth-box" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md p-8 text-center relative overflow-hidden">
            <div class="absolute top-[-50px] right-[-50px] w-32 h-32 bg-green-500 rounded-full blur-3xl opacity-20"></div>
            <div class="absolute bottom-[-50px] left-[-50px] w-32 h-32 bg-blue-500 rounded-full blur-3xl opacity-20"></div>
            
            <div class="floating mb-6"><i class="fas fa-gamepad text-6xl text-green-400 drop-shadow-lg"></i></div>
            <h1 class="text-3xl font-bold mb-8 tracking-wider">RS <span class="text-green-400">GAME</span></h1>
            
            <input type="email" id="email" placeholder="อีเมลของคุณ" class="w-full mb-4 p-4 rounded-xl input-dark">
            <input type="password" id="pw" placeholder="รหัสผ่าน" class="w-full mb-4 p-4 rounded-xl input-dark">
            <input type="text" id="name" placeholder="ชื่อเล่น (เฉพาะสมัครใหม่)" class="w-full mb-8 p-4 rounded-xl input-dark">
            
            <button onclick="login()" class="w-full btn-neon font-bold py-4 rounded-xl mb-4 text-lg shadow-lg">เข้าสู่ระบบ</button>
            <button onclick="register()" class="w-full bg-transparent border-2 border-green-500 text-green-400 font-bold py-4 rounded-xl hover:bg-green-500 hover:text-white transition">สมัครสมาชิกใหม่</button>
        </div>
    </div>

    <div id="app-box" class="hidden max-w-md mx-auto p-4">
        
        <div class="glass-panel p-5 flex justify-between items-center mb-6">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-green-400 to-blue-500 flex items-center justify-center text-xl font-bold shadow-lg"><i class="fas fa-user"></i></div>
                <div><p class="text-xs text-gray-400">ยินดีต้อนรับ,</p><p id="disp-name" class="font-bold text-lg">-</p></div>
            </div>
            <div class="text-right">
                <p class="text-xs text-gray-400">เครดิตคงเหลือ</p>
                <h2 class="text-2xl font-bold text-green-400 tracking-wider">฿ <span id="disp-bal">0.00</span></h2>
            </div>
        </div>

        <div id="sec-game" class="section active">
            <div class="glass-panel p-6 text-center min-h-[400px] flex flex-col justify-center relative overflow-hidden">
                <div id="game-setup">
                    <h2 class="text-2xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-blue-400">เป่ายิ้งฉุบ พารวย</h2>
                    <p class="text-sm text-gray-400 mb-6">เลือกจำนวนเงินและออกอาวุธเลย!</p>
                    
                    <div class="bg-gray-800/50 p-4 rounded-2xl border border-gray-700 mb-8">
                        <p class="text-xs text-gray-400 mb-2">จำนวนเงินเดิมพัน (฿)</p>
                        <input type="number" id="bet" class="text-center text-4xl w-full bg-transparent outline-none font-bold text-white placeholder-gray-600" placeholder="0">
                    </div>

                    <div class="flex justify-center gap-4">
                        <button onclick="play('rock')" class="game-btn w-24 h-24 text-5xl rounded-2xl shadow-lg flex items-center justify-center">✊</button>
                        <button onclick="play('paper')" class="game-btn w-24 h-24 text-5xl rounded-2xl shadow-lg flex items-center justify-center">🖐</button>
                        <button onclick="play('scissors')" class="game-btn w-24 h-24 text-5xl rounded-2xl shadow-lg flex items-center justify-center">✌</button>
                    </div>
                </div>

                <div id="game-anim" class="hidden py-10">
                    <div class="flex justify-between items-center px-4">
                        <div class="text-center"><p class="text-green-400 mb-4 font-bold">คุณ</p><div id="u-hand" class="anim-fight">✊</div></div>
                        <div class="text-3xl font-black text-red-500 italic px-4">VS</div>
                        <div class="text-center"><p class="text-red-400 mb-4 font-bold">บอท</p><div id="b-hand" class="anim-fight" style="transform:scaleX(-1);">✊</div></div>
                    </div>
                    <div id="game-status" class="mt-10 text-xl font-bold text-yellow-400 animate-pulse tracking-widest">กำลังดวล...</div>
                </div>
            </div>
        </div>

        <div id="sec-bank" class="section">
            <div class="glass-panel p-6 mb-4 text-center">
                <div class="w-16 h-16 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-3 text-green-400 text-2xl"><i class="fas fa-arrow-down"></i></div>
                <h2 class="text-xl font-bold mb-2">เติมเครดิต</h2>
                <p class="text-sm text-gray-400 mb-6">ติดต่อแอดมินเพื่อทำรายการฝากเงิน</p>
                <button onclick="contactAdmin()" class="w-full bg-[#00B900] text-white font-bold py-4 rounded-xl shadow-lg hover:bg-[#009900] transition flex items-center justify-center gap-2"><i class="fab fa-line text-2xl"></i> ติดต่อแอดมิน (LINE)</button>
            </div>

            <div class="glass-panel p-6">
                <div class="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-3 text-red-400 text-2xl"><i class="fas fa-arrow-up"></i></div>
                <h2 class="text-xl font-bold mb-6 text-center">ถอนเงิน</h2>
                
                <input type="number" id="wd-amount" placeholder="จำนวนเงิน (฿)" class="w-full p-4 rounded-xl input-dark mb-4 text-lg">
                <select id="wd-bank" class="w-full p-4 rounded-xl input-dark mb-4 text-gray-300">
                    <option value="">-- เลือกธนาคาร --</option>
                    <option value="KBANK">กสิกรไทย</option><option value="SCB">ไทยพาณิชย์</option><option value="BBL">กรุงเทพ</option><option value="KTB">กรุงไทย</option><option value="PROMPTPAY">พร้อมเพย์</option>
                </select>
                <input type="text" id="wd-acc" placeholder="เลขบัญชี / เบอร์พร้อมเพย์" class="w-full p-4 rounded-xl input-dark mb-6">
                
                <button onclick="requestWithdraw()" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-4 rounded-xl shadow-lg transition">ยืนยันการถอน</button>
            </div>
        </div>

        <div id="sec-profile" class="section glass-panel p-8 text-center">
            <div class="w-28 h-28 bg-gradient-to-tr from-green-400 to-blue-500 rounded-full flex items-center justify-center text-5xl mx-auto mb-4 shadow-lg border-4 border-slate-800"><i class="fas fa-user-astronaut"></i></div>
            <h2 id="prof-name" class="text-2xl font-bold mb-1">-</h2>
            <p id="prof-email" class="text-gray-400 mb-8">-</p>
            
            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                    <p class="text-xs text-gray-400">สถานะไอดี</p><p class="font-bold text-green-400 mt-1">ปกติ</p>
                </div>
                <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                    <p class="text-xs text-gray-400">เข้าสู่ระบบผ่าน</p><p class="font-bold text-blue-400 mt-1">Email</p>
                </div>
            </div>

            <button onclick="auth.signOut()" class="w-full bg-transparent border border-red-500 text-red-500 font-bold py-4 rounded-xl hover:bg-red-500 hover:text-white transition">ออกจากระบบ</button>
        </div>
    </div>

    <div id="bottom-nav" class="hidden fixed bottom-0 left-0 w-full glass-panel rounded-t-3xl border-b-0 border-x-0 flex justify-around p-2 z-50">
        <button class="nav-btn active flex-1 py-3 text-center flex flex-col items-center gap-1" onclick="switchTab('sec-game', this)"><i class="fas fa-gamepad text-2xl"></i><span class="text-[10px] font-bold tracking-wide">PLAY</span></button>
        <button class="nav-btn flex-1 py-3 text-center flex flex-col items-center gap-1" onclick="switchTab('sec-bank', this)"><i class="fas fa-wallet text-2xl"></i><span class="text-[10px] font-bold tracking-wide">WALLET</span></button>
        <button class="nav-btn flex-1 py-3 text-center flex flex-col items-center gap-1" onclick="switchTab('sec-profile', this)"><i class="fas fa-user text-2xl"></i><span class="text-[10px] font-bold tracking-wide">PROFILE</span></button>
    </div>

    <script>
        // ⚠️ โค้ด Firebase ตัวใหม่
        const firebaseConfig = {
            apiKey: "AIzaSyDaeVJ1mUxjm1gG4GMTfZyqJsjImiISzPI",
            authDomain: "gaga-1eb83.firebaseapp.com",
            projectId: "gaga-1eb83",
            storageBucket: "gaga-1eb83.firebasestorage.app",
            messagingSenderId: "241797035141",
            appId: "1:241797035141:web:510775c443e9f7b50ee5ec"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(); const db = firebase.firestore();

        let userData = null; let adminLink = '';
        
        // ธีม Alert
        const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 2000, background: '#1e293b', color: '#fff' });

        db.collection('settings').doc('admin').onSnapshot(doc => { if(doc.exists) adminLink = doc.data().contact_link; });

        function switchTab(tabId, btn) {
            document.querySelectorAll('.section').forEach(el => { el.classList.remove('active'); setTimeout(()=>el.style.display='none',50); });
            setTimeout(() => {
                const target = document.getElementById(tabId); target.style.display = 'block';
                setTimeout(() => target.classList.add('active'), 50);
            }, 50);
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active')); btn.classList.add('active');
        }

        async function register() {
            const e = document.getElementById('email').value, p = document.getElementById('pw').value, n = document.getElementById('name').value;
            if(!e || !p || !n) return Toast.fire({icon: 'warning', title: 'กรุณากรอกข้อมูลให้ครบ'});
            Swal.fire({title:'กำลังสร้างบัญชี...', background: '#1e293b', color: '#fff', didOpen:()=>Swal.showLoading()});
            try {
                const cred = await auth.createUserWithEmailAndPassword(e, p);
                await db.collection('users').doc(cred.user.uid).set({ email: e, name: n, balance: 0, winRate: 35 });
                Swal.close(); Toast.fire({icon: 'success', title: 'สมัครสมาชิกสำเร็จ!'});
            } catch (err) { Swal.fire({icon:'error', title:'ผิดพลาด', text:'อีเมลนี้มีในระบบแล้ว หรือรหัสผ่านสั้นเกินไป', background: '#1e293b', color: '#fff'}); }
        }

        async function login() {
            const e = document.getElementById('email').value, p = document.getElementById('pw').value;
            if(!e || !p) return Toast.fire({icon: 'warning', title: 'กรอกอีเมลและรหัสผ่าน'});
            Swal.fire({title:'กำลังเข้าสู่ระบบ...', background: '#1e293b', color: '#fff', didOpen:()=>Swal.showLoading()});
            try { await auth.signInWithEmailAndPassword(e, p); Swal.close(); } 
            catch (err) { Swal.fire({icon:'error', title:'ผิดพลาด', text:'อีเมลหรือรหัสผ่านไม่ถูกต้อง', background: '#1e293b', color: '#fff'}); }
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('auth-box').classList.add('hidden'); document.getElementById('app-box').classList.remove('hidden'); document.getElementById('bottom-nav').classList.remove('hidden'); document.getElementById('bottom-nav').classList.add('flex');
                db.collection('users').doc(user.uid).onSnapshot(doc => {
                    if(doc.exists) {
                        userData = doc.data();
                        document.getElementById('disp-name').innerText = userData.name; document.getElementById('prof-name').innerText = userData.name; document.getElementById('prof-email').innerText = userData.email;
                        document.getElementById('disp-bal').innerText = (userData.balance||0).toLocaleString('en-US',{minimumFractionDigits:2});
                    }
                });
            } else {
                document.getElementById('auth-box').classList.remove('hidden'); document.getElementById('app-box').classList.add('hidden'); document.getElementById('bottom-nav').classList.add('hidden'); document.getElementById('bottom-nav').classList.remove('flex'); userData = null;
            }
        });

        function contactAdmin() {
            if(adminLink) window.open(adminLink, '_blank'); else Swal.fire({icon:'info', title:'แจ้งเตือน', text:'แอดมินยังไม่ได้ตั้งค่าลิงก์', background: '#1e293b', color: '#fff'});
        }

        async function requestWithdraw() {
            const amt = Number(document.getElementById('wd-amount').value), bank = document.getElementById('wd-bank').value, acc = document.getElementById('wd-acc').value;
            if(amt <= 0 || !bank || !acc) return Toast.fire({icon: 'warning', title: 'กรอกข้อมูลให้ครบ'});
            if(amt > userData.balance) return Toast.fire({icon: 'error', title: 'ยอดเงินไม่เพียงพอ'});

            Swal.fire({title:'กำลังทำรายการ...', background: '#1e293b', color: '#fff', didOpen:()=>Swal.showLoading()});
            try {
                const batch = db.batch();
                batch.update(db.collection('users').doc(auth.currentUser.uid), { balance: userData.balance - amt });
                batch.set(db.collection('transactions').doc(), { uid: auth.currentUser.uid, name: userData.name, amount: amt, bankName: bank, bankAcc: acc, status: 'pending', dateStr: new Date().toLocaleString('th-TH') });
                await batch.commit();
                document.getElementById('wd-amount').value = ''; document.getElementById('wd-acc').value = ''; document.getElementById('wd-bank').value = '';
                Swal.fire({icon:'success', title:'สำเร็จ', text:'ส่งคำขอถอนเงินแล้ว รอแอดมินอนุมัติ', background: '#1e293b', color: '#fff'});
            } catch(e) { Swal.fire({icon:'error', title:'ผิดพลาด', text:'ไม่สามารถทำรายการได้', background: '#1e293b', color: '#fff'}); }
        }

        // Game Logic & Animation
        const emojis = { rock: '✊', paper: '🖐', scissors: '✌' };
        const winMap = { rock: 'scissors', paper: 'rock', scissors: 'paper' };
        const loseMap = { rock: 'paper', paper: 'scissors', scissors: 'rock' };

        function play(choice) {
            const bet = Number(document.getElementById('bet').value);
            if(bet <= 0 || !bet) return Toast.fire({icon: 'warning', title: 'กรุณาใส่จำนวนเงินเดิมพัน'});
            if(bet > userData.balance) return Toast.fire({icon: 'error', title: 'ยอดเงินไม่เพียงพอ'});

            document.getElementById('game-setup').classList.add('hidden'); document.getElementById('game-anim').classList.remove('hidden');
            const uh = document.getElementById('u-hand'), bh = document.getElementById('b-hand'), stat = document.getElementById('game-status');
            
            uh.className = 'anim-fight'; bh.className = 'anim-fight';
            uh.innerText = '✊'; bh.innerText = '✊'; stat.innerText = 'กำลังดวล...'; stat.className = "mt-10 text-xl font-bold text-yellow-400 animate-pulse tracking-widest";

            setTimeout(async () => {
                const rate = userData.winRate !== undefined ? userData.winRate : 35;
                const isWin = (Math.random() * 100) <= rate;
                const bChoice = isWin ? winMap[choice] : loseMap[choice];
                const change = isWin ? bet : -bet;

                uh.className = `result-pop ${isWin ? 'glow-win' : 'glow-lose'}`; bh.className = `result-pop ${!isWin ? 'glow-win' : 'glow-lose'}`;
                uh.innerText = emojis[choice]; bh.innerText = emojis[bChoice];
                stat.innerText = isWin ? `+ ${change} ฿` : `${change} ฿`;
                stat.className = `mt-10 text-4xl font-black tracking-widest ${isWin ? 'text-green-400 glow-win' : 'text-red-500 glow-lose'} result-pop`;

                await db.collection('users').doc(auth.currentUser.uid).update({ balance: userData.balance + change });

                setTimeout(() => {
                    Swal.fire({ title: isWin ? 'WINNER!' : 'YOU LOSE!', html: `<span class="text-2xl">${isWin ? 'ได้เงิน' : 'เสียเงิน'} <b class="${isWin?'text-green-400':'text-red-500'}">${Math.abs(change)}</b> ฿</span>`, background: '#1e293b', color: '#fff', confirmButtonColor: '#10b981', confirmButtonText: 'PLAY AGAIN' }).then(() => {
                        document.getElementById('game-anim').classList.add('hidden'); document.getElementById('game-setup').classList.remove('hidden');
                    });
                }, 1000);
            }, 2000);
        }
    </script>
</body>
</html>
