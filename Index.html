<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS PAOSHUB - Premium Casino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { gold: '#D4AF37', dark: '#121212', darker: '#0a0a0a' } } } }
    </script>
    <style>
        body { background-color: #0a0a0a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .gold-border { border: 1px solid #D4AF37; }
        .gold-text { color: #D4AF37; }
        .btn-gold { background: linear-gradient(45deg, #B8860B, #FFD700, #B8860B); color: black; font-weight: bold; transition: all 0.3s; }
        .btn-gold:hover { transform: scale(1.05); shadow: 0 0 15px #D4AF37; }
        .btn-game { font-size: 2rem; padding: 1rem; border-radius: 50%; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; }
        .selected-bet { border: 3px solid #FFF; transform: scale(1.1); box-shadow: 0 0 15px #FFF; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div id="login-section" class="w-full max-w-md bg-dark p-8 rounded-xl gold-border shadow-2xl">
        <h1 class="text-3xl font-bold text-center gold-text mb-6">RS PAOSHUB</h1>
        <input type="email" id="email" placeholder="Email" class="w-full mb-4 p-3 bg-darker border border-gray-700 rounded text-white focus:outline-none focus:border-gold">
        <input type="password" id="password" placeholder="Password" class="w-full mb-6 p-3 bg-darker border border-gray-700 rounded text-white focus:outline-none focus:border-gold">
        <button id="login-btn" class="w-full btn-gold py-3 rounded mb-4">เข้าสู่ระบบ</button>
        <div class="flex items-center justify-between mt-4">
            <hr class="w-full border-gray-700"><span class="px-2 text-gray-500">หรือ</span><hr class="w-full border-gray-700">
        </div>
        <button id="auto-register-btn" class="w-full bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 rounded mt-4 border border-gray-600 transition">สร้าง ID อัตโนมัติ</button>
    </div>

    <div id="game-section" class="w-full max-w-2xl bg-dark p-6 rounded-xl gold-border shadow-2xl hidden mt-8">
        <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
            <h1 class="text-2xl font-bold gold-text">RS PAOSHUB</h1>
            <button id="logout-btn" class="text-red-500 hover:text-red-400">ออกจากระบบ</button>
        </div>
        
        <div class="text-center mb-8">
            <p class="text-gray-400">ยอดเงินคงเหลือ</p>
            <h2 class="text-5xl font-bold text-green-400 my-2">฿ <span id="balance-display">0</span></h2>
            <p class="text-sm text-gray-500" id="user-email"></p>
        </div>

        <div class="mb-8">
            <p class="text-center gold-text mb-4">เลือกราคาเดิมพัน</p>
            <div class="flex justify-center gap-4">
                <button class="bet-btn w-20 py-2 bg-gray-800 rounded-lg border border-gray-600 hover:border-gold" data-amount="20">20</button>
                <button class="bet-btn w-20 py-2 bg-gray-800 rounded-lg border border-gray-600 hover:border-gold" data-amount="100">100</button>
                <button class="bet-btn w-20 py-2 bg-gray-800 rounded-lg border border-gray-600 hover:border-gold" data-amount="500">500</button>
            </div>
        </div>

        <div class="mb-8">
            <p class="text-center gold-text mb-4">เลือกอาวุธของคุณ</p>
            <div class="flex justify-center gap-6">
                <button class="rps-btn btn-game bg-gray-800 border border-gray-600 hover:border-gold" data-choice="rock">✊</button>
                <button class="rps-btn btn-game bg-gray-800 border border-gray-600 hover:border-gold" data-choice="paper">🖐</button>
                <button class="rps-btn btn-game bg-gray-800 border border-gray-600 hover:border-gold" data-choice="scissors">✌</button>
            </div>
        </div>

        <div class="mt-8 border-t border-gray-800 pt-4">
            <h3 class="gold-text mb-4">ประวัติการเล่นล่าสุด</h3>
            <div id="history-list" class="space-y-2 max-h-40 overflow-y-auto pr-2 text-sm">
                </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCrpBKrWplX3qQT_h-QMftmaTSV71sikf4",
            authDomain: "fnag-b078c.firebaseapp.com",
            projectId: "fnag-b078c",
            storageBucket: "fnag-b078c.firebasestorage.app",
            messagingSenderId: "168663975101",
            appId: "1:168663975101:web:84b93e4a74494349df23d4",
            measurementId: "G-ZX60KQQ86V"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentBet = 0;
        let userData = null;

        // UI Elements
        const loginSec = document.getElementById('login-section');
        const gameSec = document.getElementById('game-section');
        const balanceDisplay = document.getElementById('balance-display');
        const historyList = document.getElementById('history-list');

        // Betting Logic
        document.querySelectorAll('.bet-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('selected-bet', 'btn-gold'));
                btn.classList.add('selected-bet', 'btn-gold');
                currentBet = parseInt(btn.dataset.amount);
            });
        });

        // Game Logic (Rigged System)
        document.querySelectorAll('.rps-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                if(currentBet === 0) return Swal.fire({ icon: 'warning', title: 'กรุณาเลือกเดิมพัน!', background: '#121212', color: '#D4AF37' });
                if(!userData || userData.balance < currentBet) return Swal.fire({ icon: 'error', title: 'ยอดเงินไม่พอ!', background: '#121212', color: '#D4AF37' });

                const userChoice = btn.dataset.choice;
                const winMap = { rock: 'scissors', paper: 'rock', scissors: 'paper' };
                const loseMap = { rock: 'paper', paper: 'scissors', scissors: 'rock' };
                const icons = { rock: '✊', paper: '🖐', scissors: '✌' };

                // Rigged Roll
                const roll = Math.random() * 100;
                const isWin = roll <= userData.winRate; // If within winRate (e.g. 35%), user wins.
                
                let botChoice = '';
                let resultText = '';
                let amountChange = 0;

                if (isWin) {
                    botChoice = winMap[userChoice]; // บังคับบอทออกตัวที่แพ้
                    resultText = 'ชนะ';
                    amountChange = currentBet;
                } else {
                    botChoice = loseMap[userChoice]; // บังคับบอทออกตัวที่ชนะ
                    resultText = 'แพ้';
                    amountChange = -currentBet;
                }

                // Update Database
                const userRef = doc(db, 'users', auth.currentUser.uid);
                const historyItem = {
                    time: new Date().toLocaleString('th-TH'),
                    bet: currentBet,
                    choice: userChoice,
                    botChoice: botChoice,
                    result: resultText,
                    amountChange: amountChange
                };

                try {
                    await updateDoc(userRef, {
                        balance: userData.balance + amountChange,
                        history: arrayUnion(historyItem)
                    });

                    Swal.fire({
                        title: `คุณ${resultText}!`,
                        html: `คุณ: ${icons[userChoice]} <br> บอท: ${icons[botChoice]}<br><br>${resultText === 'ชนะ' ? '+' : ''}${amountChange} ฿`,
                        icon: isWin ? 'success' : 'error',
                        background: '#121212',
                        color: isWin ? '#4ade80' : '#ef4444',
                        confirmButtonColor: '#D4AF37'
                    });
                } catch (error) {
                    Swal.fire('Error', 'เกิดข้อผิดพลาด กรุณาลองใหม่', 'error');
                }
            });
        });

        // Auto Create ID
        document.getElementById('auto-register-btn').addEventListener('click', async () => {
            const rdm = Math.floor(Math.random() * 1000000);
            const email = `user${rdm}@rspaoshub.com`;
            const password = `Pass${rdm}!`;
            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, password);
                await setDoc(doc(db, "users", userCred.user.uid), {
                    uid: userCred.user.uid,
                    email: email,
                    balance: 1000, // แจกเครดิตฟรีเริ่มต้น (ปรับได้)
                    winRate: 35, // Rate เริ่มต้น
                    history: []
                });
                Swal.fire({ icon: 'success', title: 'สร้าง ID สำเร็จ', text: `Email: ${email}\nPassword: ${password}`, background: '#121212', color: '#D4AF37' });
            } catch (error) { console.error(error); }
        });

        // Standard Login
        document.getElementById('login-btn').addEventListener('click', () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, e, p).catch(err => Swal.fire('Error', 'รหัสผ่านผิด หรือไม่มีบัญชีนี้', 'error'));
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        // Auth State & Real-time Sync
        onAuthStateChanged(auth, user => {
            if (user) {
                loginSec.classList.add('hidden');
                gameSec.classList.remove('hidden');
                document.getElementById('user-email').innerText = user.email;

                // Real-time Sync Balance & History
                onSnapshot(doc(db, "users", user.uid), (doc) => {
                    userData = doc.data();
                    balanceDisplay.innerText = userData.balance.toLocaleString();
                    
                    historyList.innerHTML = '';
                    if(userData.history) {
                        const reversedHistory = [...userData.history].reverse(); // ล่าสุดขึ้นก่อน
                        reversedHistory.forEach(h => {
                            const color = h.result === 'ชนะ' ? 'text-green-400' : 'text-red-400';
                            historyList.innerHTML += `<div class="flex justify-between bg-darker p-2 rounded">
                                <span class="text-gray-400">${h.time}</span>
                                <span>เดิมพัน: ${h.bet}</span>
                                <span class="${color} font-bold">${h.result} (${h.amountChange > 0 ? '+':''}${h.amountChange})</span>
                            </div>`;
                        });
                    }
                });
            } else {
                loginSec.classList.remove('hidden');
                gameSec.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
