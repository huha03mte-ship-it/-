<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS Game | เล่นเกมได้เงินจริง</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Kanit', sans-serif; background: #f0fdf4; color: #1f2937; }
        .glass-card { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border: 1px solid rgba(34,197,94,0.2); box-shadow: 0 8px 32px rgba(34,197,94,0.1); }
        .menu-btn.active { color: #22c55e; border-bottom: 3px solid #22c55e; font-weight: 600; }
        .section { display: none; animation: fadeIn 0.4s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Game Anim */
        @keyframes shake { 0%, 50%, 100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-15px) rotate(-15deg); } 75% { transform: translateY(-15px) rotate(15deg); } }
        .anim-shake { animation: shake 0.5s infinite; font-size: 5rem; display: inline-block; }
        .result-emoji { font-size: 5rem; display: inline-block; animation: fadeIn 0.3s ease; }
    </style>
</head>
<body class="min-h-screen pb-20 md:pt-10">

    <div id="auth-box" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-md p-8 rounded-2xl">
            <h1 class="text-3xl font-bold text-center text-green-500 mb-6"><i class="fas fa-leaf"></i> RS Game</h1>
            <input type="email" id="email" placeholder="อีเมล" class="w-full mb-4 p-3 border border-green-200 rounded-lg outline-none">
            <input type="password" id="pw" placeholder="รหัสผ่าน" class="w-full mb-4 p-3 border border-green-200 rounded-lg outline-none">
            <input type="text" id="name" placeholder="ชื่อเล่น (ใส่เฉพาะตอนสมัคร)" class="w-full mb-6 p-3 border border-green-200 rounded-lg outline-none">
            <button onclick="login()" class="w-full bg-green-500 text-white font-bold py-3 rounded-lg mb-3 shadow hover:bg-green-600">เข้าสู่ระบบ</button>
            <button onclick="register()" class="w-full bg-white text-green-600 border border-green-500 font-bold py-3 rounded-lg shadow hover:bg-green-50">สมัครสมาชิก</button>
        </div>
    </div>

    <div id="app-box" class="hidden max-w-md mx-auto p-4">
        
        <div class="glass-card p-4 rounded-xl flex justify-between items-center mb-6">
            <div><p class="text-sm text-gray-500">สวัสดี,</p><p id="disp-name" class="font-bold text-gray-800">-</p></div>
            <div class="text-right"><p class="text-sm text-gray-500">ยอดเงิน</p><h2 class="text-2xl font-bold text-green-500">฿ <span id="disp-bal">0.00</span></h2></div>
        </div>

        <div id="sec-game" class="section active text-center glass-card p-6 rounded-xl">
            <div id="game-setup">
                <h2 class="text-xl font-bold mb-4">เป่ายิ้งฉุบ พารวย</h2>
                <input type="number" id="bet" class="text-center text-3xl w-full border-b-2 border-green-500 bg-transparent outline-none py-2 font-bold mb-6 text-green-600" placeholder="ใส่เงินเดิมพัน">
                <div class="flex justify-center gap-4">
                    <button onclick="play('rock')" class="w-20 h-20 text-4xl bg-white border-2 border-green-200 rounded-full shadow hover:bg-green-50 transition">✊</button>
                    <button onclick="play('paper')" class="w-20 h-20 text-4xl bg-white border-2 border-green-200 rounded-full shadow hover:bg-green-50 transition">🖐</button>
                    <button onclick="play('scissors')" class="w-20 h-20 text-4xl bg-white border-2 border-green-200 rounded-full shadow hover:bg-green-50 transition">✌</button>
                </div>
            </div>
            <div id="game-anim" class="hidden py-8">
                <div class="flex justify-center items-center gap-8">
                    <div><p class="text-sm text-gray-500">คุณ</p><div id="u-hand" class="anim-shake">✊</div></div>
                    <div class="text-2xl font-bold text-gray-400">VS</div>
                    <div><p class="text-sm text-gray-500">บอท</p><div id="b-hand" class="anim-shake" style="transform:scaleX(-1);">✊</div></div>
                </div>
                <p class="text-green-500 font-bold mt-6 animate-pulse">กำลังสุ่มผล...</p>
            </div>
        </div>

        <div id="sec-bank" class="section">
            <div class="glass-card p-6 rounded-xl text-center mb-4">
                <h2 class="text-lg font-bold text-gray-800 mb-2"><i class="fas fa-arrow-down text-green-500"></i> ฝากเงิน</h2>
                <p class="text-sm text-gray-500 mb-4">การฝากเงินกรุณาติดต่อแอดมินพร้อมแจ้งอีเมลของคุณ</p>
                <button onclick="contactAdmin()" class="w-full bg-[#06C755] text-white font-bold py-3 rounded-lg shadow-md hover:bg-[#05b34c]"><i class="fab fa-line text-xl mr-2"></i> ติดต่อแอดมินเพื่อฝากเงิน</button>
            </div>

            <div class="glass-card p-6 rounded-xl">
                <h2 class="text-lg font-bold text-gray-800 mb-4 text-center"><i class="fas fa-arrow-up text-red-500"></i> ถอนเงิน</h2>
                <input type="number" id="wd-amount" placeholder="จำนวนเงินที่ต้องการถอน" class="w-full p-3 border border-gray-200 rounded-lg mb-3 outline-none">
                <select id="wd-bank" class="w-full p-3 border border-gray-200 rounded-lg mb-3 outline-none">
                    <option value="">เลือกธนาคาร</option><option value="KBANK">กสิกรไทย</option><option value="SCB">ไทยพาณิชย์</option><option value="BBL">กรุงเทพ</option><option value="KTB">กรุงไทย</option><option value="PROMPTPAY">พร้อมเพย์</option>
                </select>
                <input type="text" id="wd-acc" placeholder="เลขบัญชี / เบอร์พร้อมเพย์" class="w-full p-3 border border-gray-200 rounded-lg mb-4 outline-none">
                <button onclick="requestWithdraw()" class="w-full bg-red-500 text-white font-bold py-3 rounded-lg shadow-md hover:bg-red-600">ยืนยันการถอนเงิน</button>
            </div>
        </div>

        <div id="sec-profile" class="section glass-card p-6 rounded-xl text-center">
            <div class="w-20 h-20 bg-green-500 text-white rounded-full flex items-center justify-center text-3xl mx-auto mb-4 shadow"><i class="fas fa-user"></i></div>
            <h2 id="prof-name" class="text-xl font-bold text-gray-800">-</h2>
            <p id="prof-email" class="text-gray-500 mb-6">-</p>
            <button onclick="auth.signOut()" class="w-full bg-gray-200 text-gray-700 font-bold py-3 rounded-lg hover:bg-gray-300">ออกจากระบบ</button>
        </div>

    </div>

    <div id="bottom-nav" class="hidden fixed bottom-0 left-0 w-full bg-white border-t border-gray-100 shadow-lg flex justify-around p-2 z-50">
        <button class="menu-btn active flex-1 py-2 text-center text-gray-400" onclick="switchTab('sec-game', this)"><i class="fas fa-gamepad block text-xl mb-1"></i><span class="text-xs">เล่นเกม</span></button>
        <button class="menu-btn flex-1 py-2 text-center text-gray-400" onclick="switchTab('sec-bank', this)"><i class="fas fa-wallet block text-xl mb-1"></i><span class="text-xs">ฝาก-ถอน</span></button>
        <button class="menu-btn flex-1 py-2 text-center text-gray-400" onclick="switchTab('sec-profile', this)"><i class="fas fa-user block text-xl mb-1"></i><span class="text-xs">บัญชี</span></button>
    </div>

    <script>
        // ⚠️ โค้ด Firebase ของคุณ
        const firebaseConfig = { apiKey: "AIzaSyCrpBKrWplX3qQT_h-QMftmaTSV71sikf4", projectId: "fnag-b078c" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(); const db = firebase.firestore();

        let userData = null; let adminLink = '';

        // ดึงลิงก์แอดมิน
        db.collection('settings').doc('admin').onSnapshot(doc => { if(doc.exists) adminLink = doc.data().contact_link; });

        function switchTab(tabId, btn) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.querySelectorAll('.menu-btn').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
        }

        async function register() {
            const e = document.getElementById('email').value, p = document.getElementById('pw').value, n = document.getElementById('name').value;
            if(!e || !p || !n) return Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูลให้ครบ (ต้องใส่ชื่อด้วย)', 'warning');
            Swal.fire({title:'กำลังสมัคร...', didOpen:()=>Swal.showLoading()});
            try {
                const cred = await auth.createUserWithEmailAndPassword(e, p);
                await db.collection('users').doc(cred.user.uid).set({ email: e, name: n, balance: 0, winRate: 35 });
                Swal.close();
            } catch (err) { Swal.fire('ผิดพลาด', 'อีเมลนี้ถูกใช้แล้ว หรือรหัสผ่านสั้นไป', 'error'); }
        }

        async function login() {
            const e = document.getElementById('email').value, p = document.getElementById('pw').value;
            if(!e || !p) return Swal.fire('แจ้งเตือน', 'กรอกอีเมลและรหัสผ่าน', 'warning');
            Swal.fire({title:'กำลังเข้าสู่ระบบ...', didOpen:()=>Swal.showLoading()});
            try { await auth.signInWithEmailAndPassword(e, p); Swal.close(); } catch (err) { Swal.fire('ผิดพลาด', 'ข้อมูลไม่ถูกต้อง', 'error'); }
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('auth-box').classList.add('hidden');
                document.getElementById('app-box').classList.remove('hidden');
                document.getElementById('bottom-nav').classList.remove('hidden');
                
                db.collection('users').doc(user.uid).onSnapshot(doc => {
                    if(doc.exists) {
                        userData = doc.data();
                        document.getElementById('disp-name').innerText = userData.name;
                        document.getElementById('prof-name').innerText = userData.name;
                        document.getElementById('prof-email').innerText = userData.email;
                        document.getElementById('disp-bal').innerText = (userData.balance||0).toLocaleString('en-US',{minimumFractionDigits:2});
                    }
                });
            } else {
                document.getElementById('auth-box').classList.remove('hidden');
                document.getElementById('app-box').classList.add('hidden');
                document.getElementById('bottom-nav').classList.add('hidden');
                userData = null;
            }
        });

        function contactAdmin() {
            if(adminLink) window.open(adminLink, '_blank');
            else Swal.fire('แจ้งเตือน', 'แอดมินยังไม่ได้ตั้งค่าลิงก์ติดต่อ', 'info');
        }

        async function requestWithdraw() {
            const amt = Number(document.getElementById('wd-amount').value);
            const bank = document.getElementById('wd-bank').value;
            const acc = document.getElementById('wd-acc').value;

            if(amt <= 0 || !bank || !acc) return Swal.fire('แจ้งเตือน', 'กรอกข้อมูลให้ครบถ้วน', 'warning');
            if(amt > userData.balance) return Swal.fire('ผิดพลาด', 'ยอดเงินไม่เพียงพอ', 'error');

            Swal.fire({title:'กำลังส่งคำขอ...', didOpen:()=>Swal.showLoading()});
            try {
                const batch = db.batch();
                // หักเงินทันที
                batch.update(db.collection('users').doc(auth.currentUser.uid), { balance: userData.balance - amt });
                // สร้างบิล
                batch.set(db.collection('transactions').doc(), {
                    uid: auth.currentUser.uid, name: userData.name, amount: amt, bankName: bank, bankAcc: acc, status: 'pending', dateStr: new Date().toLocaleString('th-TH')
                });
                await batch.commit();
                
                document.getElementById('wd-amount').value = ''; document.getElementById('wd-acc').value = ''; document.getElementById('wd-bank').value = '';
                Swal.fire('สำเร็จ', 'ส่งคำขอถอนเงินแล้ว กรุณารอแอดมินอนุมัติ', 'success');
            } catch(e) { Swal.fire('ผิดพลาด', 'ไม่สามารถทำรายการได้', 'error'); }
        }

        // --- ระบบเกม ---
        const emojis = { rock: '✊', paper: '🖐', scissors: '✌' };
        const winMap = { rock: 'scissors', paper: 'rock', scissors: 'paper' };
        const loseMap = { rock: 'paper', paper: 'scissors', scissors: 'rock' };

        function play(choice) {
            const bet = Number(document.getElementById('bet').value);
            if(bet <= 0 || !bet) return Swal.fire('แจ้งเตือน', 'ใส่เงินเดิมพันให้ถูกต้อง', 'warning');
            if(bet > userData.balance) return Swal.fire('ผิดพลาด', 'ยอดเงินไม่เพียงพอ', 'error');

            document.getElementById('game-setup').classList.add('hidden');
            document.getElementById('game-anim').classList.remove('hidden');
            
            const uh = document.getElementById('u-hand'); const bh = document.getElementById('b-hand');
            uh.className = 'anim-shake'; bh.className = 'anim-shake';
            uh.innerText = '✊'; bh.innerText = '✊';

            setTimeout(async () => {
                uh.className = 'result-emoji'; bh.className = 'result-emoji';
                
                const rate = userData.winRate !== undefined ? userData.winRate : 35;
                const isWin = (Math.random() * 100) <= rate;
                
                const bChoice = isWin ? winMap[choice] : loseMap[choice];
                uh.innerText = emojis[choice]; bh.innerText = emojis[bChoice];

                const change = isWin ? bet : -bet;
                await db.collection('users').doc(auth.currentUser.uid).update({ balance: userData.balance + change });

                setTimeout(() => {
                    Swal.fire({
                        title: isWin ? 'คุณชนะ!' : 'คุณแพ้!', 
                        html: `ได้รับ <span class="${isWin?'text-green-500':'text-red-500'} font-bold">${isWin?'+':''}${change}</span> ฿`,
                        icon: isWin ? 'success' : 'error',
                        confirmButtonColor: '#22c55e', confirmButtonText: 'เล่นอีกครั้ง'
                    }).then(() => {
                        document.getElementById('game-anim').classList.add('hidden');
                        document.getElementById('game-setup').classList.remove('hidden');
                    });
                }, 500);
            }, 2000);
        }
    </script>
</body>
</html>
